name: PKbrainWidgets
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(PK_WIDGET_TEAM)"
    CODE_SIGN_STYLE: Automatic
targets:
  PKbrainWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: ../../src/widgets/PKbrainWidgets.swift
      - path: ../../src/macos/PKbrain/Models/WidgetNoteSnapshot.swift
      - path: ../../src/widgets/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mondary.pkbrain.widgets
        PRODUCT_NAME: PKbrainWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "$(PK_WIDGET_CONFIG_DIR)/WidgetInfo.plist"
        CODE_SIGN_ENTITLEMENTS: "$(PK_WIDGET_CONFIG_DIR)/Widget.entitlements"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
schemes:
  PKbrainWidgets:
    build:
      targets:
        PKbrainWidgets: all
